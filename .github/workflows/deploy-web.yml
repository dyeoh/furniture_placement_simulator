# Build the simulator for the browser and publish it to GitHub Pages.
#
# Adapted from the engine fork's godot-web-pages.yml. The store embeds the
# Pages URL in an <iframe>, so this is the production deploy, not a demo.
#
# Single-threaded on purpose: a Shopify storefront cannot send COOP/COEP
# headers, so a threaded (SharedArrayBuffer) build would fail to link there.
# See game/bin/box3d.gdextension for the long version.
#
# Nothing is committed by this workflow; the build is uploaded as a Pages
# artifact. The wasm extension is built from the submodule every run and cached
# by emsdk version.
name: Deploy web build to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Download tag and on-disk template directory differ: 4.7.1-stable vs 4.7.1.stable.
  GODOT_VERSION: 4.7.1-stable
  GODOT_TEMPLATE_DIR: 4.7.1.stable
  # Pinned because dlink (GDExtension on web) is sensitive to the Emscripten
  # version; this is what godot-cpp's own CI uses for 4.7. If a future export
  # template stops loading the extension, check the browser console line
  # "Build configuration: Emscripten X" and match it here.
  EM_VERSION: 4.0.11

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .gitmodules uses the SSH URL so local pushes into the fork just work;
      # the runner has no key, so rewrite to HTTPS before fetching. Both are
      # public repos, so no token is needed.
      - name: Fetch submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install scons

      - name: Cache Emscripten
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EM_VERSION }}

      - name: Install Emscripten
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install "${EM_VERSION}"
          ~/emsdk/emsdk activate "${EM_VERSION}"

      - name: Build the Box3D extension for web (no threads)
        run: |
          source ~/emsdk/emsdk_env.sh
          cd engine/box3d-godot/godot
          scons -j"$(nproc)" platform=web threads=no target=template_release
          ls -la demo/bin/*.wasm
          cp demo/bin/libbox3d_godot.web.*.wasm ../../../game/bin/

      - name: Cache Godot and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      # The template archive is ~1.2 GB, hence the cache above.
      - name: Install Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          curl -fsSL -o /tmp/godot.zip "${base}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64"
          curl -fsSL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/"${GODOT_TEMPLATE_DIR}"

      # Import before exporting. A GDScript class_name that has not been
      # imported yet gets baked into the export as a parse-broken script while
      # the export still reports success. The first import on a clean tree can
      # also abort during editor teardown after the import itself succeeded,
      # so the first run is allowed to fail and the second one is the real one.
      - name: Import project
        run: |
          GODOT=~/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT" --headless --path game --import || true
          "$GODOT" --headless --path game --import

      - name: Run the headless tests
        run: |
          GODOT=~/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64"
          # Only the Godot backend is available here (the macOS extension
          # binary is not built on Linux); the tests degrade to it and still
          # exercise placement, layout and the mover contract.
          "$GODOT" --headless --path game --script res://tests/test_placement.gd

      - name: Export
        run: |
          GODOT=~/godot-bin/"Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p web
          "$GODOT" --headless --path game --export-release "Web" ../web/index.html

      # An export "succeeds" even when the extension is missing, and the failure
      # only shows up as a broken page, so check the artifacts are really there.
      - name: Verify the build carries the extension
        run: |
          cd web
          ls -la
          for f in index.html index.js index.wasm index.pck; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          ls libbox3d_godot.web.*.nothreads.wasm >/dev/null 2>&1 \
            || { echo "exported extension is not the nothreads build; it will LinkError inside Shopify"; exit 1; }
          wasm=$(ls libbox3d_godot.web.*.nothreads.wasm | head -1)
          head -c4 "$wasm" | od -An -tx1 | grep -q "00 61 73 6d" \
            || { echo "$wasm is not a valid wasm module"; exit 1; }
          echo "extension present: $wasm ($(stat -c%s "$wasm") bytes)"

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
