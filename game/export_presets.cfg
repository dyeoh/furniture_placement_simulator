[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tools/*, tests/*"
export_path="../web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
; Single-threaded on purpose. This build is embedded in a Shopify storefront,
; which cannot send the COOP/COEP headers a threaded module needs; without
; cross-origin isolation a threaded build fails to link outright. The
; nothreads extension wasm (built with `scons platform=web threads=no`) is the
; one bin/box3d.gdextension resolves for this variant.
variant/thread_support=false
vram_texture_compression/for_desktop=true
; Off: the web platform's project check fails *silently* (empty error) when
; this is on and the project does not import ETC2/ASTC. There are no textures
; to compress here anyway.
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Adaptive: the canvas fills the <iframe> the store gives it.
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<style>body{background:#f0eee9}</style>"
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
