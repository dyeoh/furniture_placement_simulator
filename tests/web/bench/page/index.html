<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Room Planner bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f1e1c; color: #eee; font: 13px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage iframe { border: 0; width: 100%; height: 100%; display: block; background: #f0eee9; }
  #status { position: fixed; left: 8px; bottom: 8px; right: 8px; padding: 6px 10px; background: rgba(0,0,0,.72); border-radius: 6px; pointer-events: none; z-index: 2; white-space: pre-wrap; }
  #report { padding: 16px; overflow: auto; height: 100%; box-sizing: border-box; }
  #report[hidden], #stage[hidden] { display: none; }
  table { border-collapse: collapse; margin: 6px 0 18px; }
  th, td { padding: 3px 8px; border-bottom: 1px solid #444; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  h2 { font-size: 15px; margin: 14px 0 2px; } .desc { color: #aaa; }
</style>
</head>
<body>
<!-- Self-running benchmark for the Godot and three.js builds (tests/web/bench).
     Drives each build in a same-origin <iframe> through the postMessage contract
     both speak, samples frame times inside it, and publishes window.__bench for
     whatever opened the page: Playwright locally, WebDriver on BrowserStack, or
     a person. Query: ?targets=godot,three&runs=3&sample=5000&quality=high&scenarios=empty,showroom -->
<div id="stage"></div>
<div id="report" hidden></div>
<div id="status">Starting…</div>
<script src="scenarios.js"></script>
<script src="bench.js"></script>
</body>
</html>
